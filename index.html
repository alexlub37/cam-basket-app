<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAM Basket Montrichard</title>
<style>
:root { --couleur-principale: #ffd400; }
body { margin:0; font-family: Arial; color:white; background:black; }

body::before {
  content:"";
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:url("fond-cam.jpg") center center no-repeat;
  background-size:contain;
  background-color:black;
  z-index:-1;
}

.container { padding:20px; text-align:center; }
.logo { width:130px; margin-top:20px; }

h1 { font-size:28px; margin:10px 0; }

.version {
  background:var(--couleur-principale);
  color:black;
  padding:10px 20px;
  border-radius:20px;
  display:inline-block;
  margin:10px;
  font-weight:bold;
}

.menu {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.card {
  background:rgba(0,0,0,0.85);
  border:2px solid var(--couleur-principale);
  border-radius:20px;
  padding:20px;
  font-weight:bold;
}

.footer {
  color:var(--couleur-principale);
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>CAM Basket<br>Montrichard</h1>

<div class="version">Version V40.45</div>

<div id="message" class="footer">Chargement...</div>

<div class="menu">
<div class="card" onclick="window.location='equipes.html'">ÉQUIPES</div>
<div class="card">BUREAU</div>
<div class="card">BÉNÉVOLES</div>
<div class="card">MISE À JOUR</div>
</div>

</div>

<script>
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwsAagDE1Hvc7iAZSkkJPzDn9Q4INQuZdphxUEPrwz65veoF3_sEJ_LzSVsYMZLsAGiwA/exec";

fetch(URL_SCRIPT)
.then(res => res.json())
.then(data => {
  let config = {};
  data.forEach(l => config[l.clé] = l.valeur);

  if(config.message_accueil){
    document.getElementById("message").innerText = config.message_accueil;
  }

  if(config.couleur_principale){
    document.documentElement.style.setProperty('--couleur-principale', config.couleur_principale);
  }
});
</script>

</body>
</html>
